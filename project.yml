name: Brink
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Brink
    PRODUCT_BUNDLE_IDENTIFIER: com.yifeng.brink
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_KEY_CFBundleDisplayName: Brink
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Brink
    INFOPLIST_KEY_NSPrincipalClass: NSApplication
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 939Q2D35JB
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Brink:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/BrinkApp
      - path: Resources
        excludes:
          - Brink/**
          - BrinkApp/**
          - BrinkWidget/**
    settings:
      base:
        PRODUCT_MODULE_NAME: BrinkApp
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/BrinkApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Brink/Brink.entitlements
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: BrinkWidget
        embed: true
    scheme:
      gatherCoverageData: false
      testTargets: []

  BrinkWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/BrinkWidget
    settings:
      base:
        PRODUCT_NAME: BrinkWidget
        PRODUCT_MODULE_NAME: BrinkWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.yifeng.brink.widget
        INFOPLIST_FILE: Resources/BrinkWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Resources/BrinkWidget/BrinkWidget.entitlements
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
      testTargets: []
